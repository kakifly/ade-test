name: CI

on:
  # PRのたびに実行する（マージ前の検証。ブランチ保護で必須にする）
  pull_request:
  # マージ後のmainでも実行する
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 結合テスト用の使い捨てPostgreSQL（CI専用。本番や開発のDBには接続しない）
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: habit_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d habit_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/habit_app_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run db:apply:test
      - run: bun test
